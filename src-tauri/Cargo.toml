[package]
name = "bilimaku"
version = "1.0.0"
description = "bilimaku desktop danmaku voice assistant"
authors = ["bilimaku contributors"]
edition = "2021"

[lib]
name = "bilimaku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
brotli = "8.0.4"
flate2 = "1.1.9"
futures-util = "0.3.33"
md-5 = "0.11.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.4", features = ["cookies", "json", "multipart", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
