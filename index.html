<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="bilimaku - 轻盈、可扩展的哔哩哔哩直播弹幕智能播报助手"
    />
    <meta name="theme-color" content="#f4f9ff" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>bilimaku｜哔哩弹幕姬</title>
    <script>
      (() => {
        const timeOriginMs = performance.timeOrigin;
        const marks = [];
        const sessionId = `${Math.round(timeOriginMs)}-${Math.random().toString(36).slice(2, 9)}`;
        const mark = (stage, detail, durationMs) => {
          const elapsedMs = Number(performance.now().toFixed(3));
          marks.push({ stage, elapsedMs, detail, durationMs });
          console.info(
            `[bilimaku perf +${elapsedMs.toFixed(1)}ms] ${stage}`,
            detail || "",
          );
        };
        window.__BILIMAKU_STARTUP__ = {
          sessionId,
          timeOriginMs,
          marks,
          mark,
        };

        const overlay = new URLSearchParams(location.search).get("overlay");
        if (overlay === "danmaku" || overlay === "sidebar") {
          document.documentElement.dataset.bilimakuOverlay = overlay;
        }

        mark("html-inline-evaluated");
        document.addEventListener(
          "DOMContentLoaded",
          () => mark("html-dom-content-loaded"),
          { once: true },
        );
        window.addEventListener("load", () => mark("html-window-load"), {
          once: true,
        });
        window.setTimeout(() => {
          const childCount = document.getElementById("root")?.childElementCount ?? -1;
          mark("html-watchdog-5s", `rootChildren=${childCount}`);
        }, 5000);
        window.setTimeout(() => {
          const childCount = document.getElementById("root")?.childElementCount ?? -1;
          mark("html-watchdog-10s", `rootChildren=${childCount}`);
        }, 10000);
      })();
    </script>
    <!-- 这段只负责零依赖开屏；业务组件的颜色仍由 src/styles/theme.ts 统一维护。 -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        background: transparent;
        color: #18324d;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      .bilimaku-startup-shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 26px;
        background:
          radial-gradient(circle at 18% 12%, rgba(223, 242, 255, 0.92) 0, transparent 33%),
          linear-gradient(145deg, rgba(248, 252, 255, 0.88) 0%, rgba(238, 247, 255, 0.78) 100%);
        backdrop-filter: blur(30px) saturate(1.28);
      }

      .bilimaku-startup-card {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #315775;
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      .bilimaku-startup-dot {
        width: 12px;
        height: 12px;
        border: 3px solid #bce4ff;
        border-top-color: #3b9edb;
        border-radius: 50%;
        animation: bilimaku-startup-spin 0.8s linear infinite;
      }

      @keyframes bilimaku-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      html[data-bilimaku-overlay] body,
      html[data-bilimaku-overlay] #root {
        background: transparent;
      }

      html[data-bilimaku-overlay] .bilimaku-startup-shell {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bilimaku-startup-shell" aria-live="polite">
        <div class="bilimaku-startup-card">
          <span class="bilimaku-startup-dot" aria-hidden="true"></span>
          <span>bilimaku 正在准备界面…</span>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const root = document.getElementById("root");
        if (!root || !window.MutationObserver) return;
        const observer = new MutationObserver(() => {
          window.__BILIMAKU_STARTUP__?.mark(
            "root-first-mutation",
            `rootChildren=${root.childElementCount}`,
          );
          observer.disconnect();
        });
        observer.observe(root, { childList: true, subtree: true });
        window.setTimeout(() => observer.disconnect(), 30000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
